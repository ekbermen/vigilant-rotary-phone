      - name: Yaz app/src/main/java/com/novax/assistant/Brain.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/Brain.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.app.Notification
          import android.app.NotificationManager
          import android.content.Context
          import java.io.IOException
          import java.net.UnknownHostException
          import java.util.concurrent.Executors

          /**
           * Beyin: önce yerel yönlendirici (anında), olmazsa Gemini (araç döngüsü). Her istek kendi thread'inde çalışır,
           * böylece birden fazla iş aynı anda yürüyebilir.
           */
          object Brain {
              private val pool = Executors.newCachedThreadPool()

              fun handle(text: String, speak: Boolean = true) {
                  pool.execute { process(text.trim(), speak) }
              }

              private fun process(text: String, speak: Boolean) {
                  if (text.isEmpty()) return
                  Voice.init(NovaxApp.instance)
                  Bus.user(text)
                  Bus.setState(OrbState.THINKING)
                  val history = MemoryStore.recentTurns(14)
                  MemoryStore.addTurn("user", text)

                  var failed = false
                  var reply: String
                  try {
                      val local = CommandRouter.tryHandle(text)
                      reply = local ?: Gemini.converse(text, history) { step -> Bus.log("⚙ $step") }
                  } catch (e: Exception) {
                      failed = true
                      reply = friendly(e)
                  }

                  if (reply.isBlank()) { Bus.setState(OrbState.IDLE); return }
                  MemoryStore.addTurn("model", reply)
                  Bus.novax(reply)
                  if (failed) Bus.setState(OrbState.ERROR)
                  if (speak) {
                      Voice.speak(reply)
                  } else if (!failed) {
                      Bus.setState(OrbState.IDLE)
                  }
              }

              private fun friendly(e: Exception): String {
                  if (e is UnknownHostException) return "İnternete ulaşamadım. Bağlantını kontrol et."
                  if (e is Gemini.GeminiException) return e.message ?: "Gemini hatası."
                  if (e is IOException) return "Ağ hatası: ${e.message}"
                  return ("Bir sorun çıktı: " + e.javaClass.simpleName + " " + (e.message ?: "")).trim()
              }

              /** Gemini'nin `background_task` aracı: ayrı bir ajan olarak çalışır, bitince bildirir ve söyler. */
              fun background(goal: String): String {
                  if (goal.isBlank()) return "HATA: görev boş"
                  pool.execute {
                      var out: String
                      try {
                          out = Gemini.converse(goal, emptyList()) { Bus.log("↳ arka plan: $it") }
                      } catch (e: Exception) {
                          out = "Başarısız: " + friendly(e)
                      }
                      MemoryStore.addTurn("model", "[arka plan görevi] $goal -> $out")
                      Bus.novax("Arka plan görevi bitti: $out")
                      postDone(goal, out)
                      if (!Voice.speaking && Bus.current == OrbState.IDLE) {
                          Voice.speak("Arka plan görevi bitti. $out")
                      }
                  }
                  return "Görev arka planda başladı. Bitince haber vereceğim."
              }

              private fun postDone(goal: String, out: String) {
                  val ctx = NovaxApp.instance
                  val n = Notification.Builder(ctx, NovaxApp.CH_ALERT)
                      .setSmallIcon(R.drawable.ic_notif)
                      .setContentTitle("Novax: " + Text.clip(goal, 40))
                      .setContentText(Text.clip(out, 120))
                      .setStyle(Notification.BigTextStyle().bigText(Text.clip(out, 800)))
                      .setAutoCancel(true).build()
                  (ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).notify((System.nanoTime() % 90000).toInt() + 2000, n)
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Bus.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/Bus.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.os.Handler
          import android.os.Looper
          import java.util.concurrent.CopyOnWriteArrayList

          enum class OrbState { IDLE, LISTENING, THINKING, SPEAKING, ERROR }

          /** Servis, ses motoru, beyin ve arayüz arasındaki hafif olay yolu. Tüm geri çağrılar ana thread'de gelir. */
          object Bus {
              interface Listener {
                  fun onUser(text: String) {}
                  fun onNovax(text: String) {}
                  fun onState(s: OrbState) {}
                  fun onLog(line: String) {}
                  fun onLevel(v: Float) {}
                  fun onPartial(text: String) {}
              }

              private val listeners = CopyOnWriteArrayList<Listener>()
              private val main = Handler(Looper.getMainLooper())

              @Volatile
              var current: OrbState = OrbState.IDLE

              /** Arayüz yeniden oluşturulduğunda sohbeti geri yüklemek için (rol, metin). */
              val transcript = CopyOnWriteArrayList<Pair<String, String>>()

              fun add(l: Listener) { listeners.addIfAbsent(l) }
              fun remove(l: Listener) { listeners.remove(l) }

              private fun each(f: (Listener) -> Unit) {
                  main.post { for (l in listeners) f(l) }
              }

              fun user(t: String) { keep("user", t); each { it.onUser(t) } }
              fun novax(t: String) { keep("novax", t); each { it.onNovax(t) } }
              fun log(t: String) { each { it.onLog(t) } }
              fun level(v: Float) { each { it.onLevel(v) } }
              fun partial(t: String) { each { it.onPartial(t) } }
              fun setState(s: OrbState) { current = s; each { it.onState(s) } }

              private fun keep(role: String, t: String) {
                  transcript.add(role to t)
                  while (transcript.size > 120) transcript.removeAt(0)
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/CommandRouter.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/CommandRouter.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import java.util.Random

          /**
           * Çevrimdışı/anında komut yönlendirici. Yüzlerce kalıp (uygulama x fiil x çekim ekleri) burada yakalanır;
           * tanımadığı her şey Gemini'ye gider. null dönerse "ben anlamadım, beyne sor" demektir; "" dönerse sessiz tamam.
           */
          object CommandRouter {
              private class Rule(val re: Regex, val fn: (MatchResult) -> String?)

              private val rules = ArrayList<Rule>()
              private val rnd = Random()
              private const val NEED_ACC = "Bunun için erişilebilirlik servisini açman gerekiyor."
              private const val OPEN = "(?:aç|ac|başlat|baslat|çalıştır|calistir|open|launch|start|göster|goster)"
              private val isOnWord = Regex("(?i)^(aç|ac|yak|çalıştır|calistir|on|etkinleştir|etkinlestir|aktif)")

              private fun MatchResult.g(i: Int): String = groupValues.getOrElse(i) { "" }.trim()
              private fun pick(vararg s: String): String = s[rnd.nextInt(s.size)]
              private fun who(): String = Prefs.userName.ifBlank { "efendim" }
              private fun acc(): Boolean = NovaxAccessibilityService.connected

              private fun r(pattern: String, fn: (MatchResult) -> String?) {
                  rules.add(Rule(Regex("(?:$pattern)", RegexOption.IGNORE_CASE), fn))
              }

              fun tryHandle(input: String): String? {
                  val advanced = NovaxFeaturePack.handle(input)
                  if (advanced != null && advanced != "NEW_CHAT") return advanced
                  if (advanced == "NEW_CHAT") {
                      return NovaxFeaturePack.newChat(NovaxApp.instance)
                  }
                  val t = Text.clean(input)
                  if (t.isEmpty()) return null
                  for (rule in rules) {
                      val m = rule.re.matchEntire(t) ?: continue
                      val out = rule.fn(m)
                      if (out != null) return out
                  }
                  return null
              }

              fun ruleCount(): Int = rules.size

              init {
                  // ============================================================ sohbet / kişilik
                  r("(?:merhaba|selam|selamlar|hey|alo|naber|günaydın|gunaydin|iyi günler|iyi akşamlar|iyi geceler|hello|hi|hola)(?:\\s+novax)?") {
                      val h = java.util.Calendar.getInstance().get(java.util.Calendar.HOUR_OF_DAY)
                      val part = when {
                          h < 6 -> "İyi geceler"
                          h < 12 -> "Günaydın"
                          h < 18 -> "İyi günler"
                          else -> "İyi akşamlar"
                      }
                      "$part ${who()}. Nasıl yardımcı olabilirim?"
                  }
                  r("(?:nasılsın|nasilsin|ne haber|keyfin nasıl|how are you|iyi misin)") {
                      pick("İyiyim ${who()}, tüm sistemler çalışıyor. Sen nasılsın?", "Gayet iyiyim, emrindeyim.", "Sistemler tam kapasite. Sen nasılsın ${who()}?")
                  }
                  r("(?:teşekkürler|tesekkurler|teşekkür ederim|sağ ol|sagol|sağol|eyvallah|saol|thanks|thank you)") {
                      pick("Rica ederim ${who()}.", "Ne demek, her zaman.", "Her zaman buradayım.")
                  }
                  r("(?:adın ne|adin ne|kimsin|sen kimsin|sen nesin|who are you|ismin ne)") {
                      "Ben Novax, telefonunda yaşayan yapay zekâ asistanıyım. Uygulama açar, mesaj atar, ekranı kontrol eder, internette arar ve seni hatırlarım."
                  }
