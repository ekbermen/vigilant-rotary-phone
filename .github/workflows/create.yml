                  r("(.+?)\\s+(?:için\\s+)?yol tarifi(?:\\s+(?:al|ver|göster|başlat))?") { m -> Act.navigate(m.g(1)) }
                  r("(?:yol tarifi|navigasyon)\\s+(?:al|ver|başlat)?\\s*(.+)") { m -> Act.navigate(m.g(1)) }
                  r("haritada\\s+(.+?)\\s+(?:göster|ara|bul|aç)") { m -> Act.navigate(m.g(1)) }
                  r("(?:google\\w*|internet\\w*|web\\w*)\\s+(.+?)(?:\\s+(?:ara|araştır|arastir|bak|bul))?") { m -> Gemini.search(m.g(1)) }
                  r("(.+?)\\s+(?:hakkında|hakkinda)\\s+(?:bilgi\\s+(?:ver|bul|ara)|araştır|arastir|ne biliyorsun)") { m -> Gemini.search(m.g(1) + " hakkında bilgi") }
                  r("(?:hava durumu|hava nasıl|hava nasil|bugün hava nasıl|yarın hava nasıl|yarin hava nasil)(?:\\s+.+)?") { m -> Gemini.search(m.value + " (kısa söyle)") }
