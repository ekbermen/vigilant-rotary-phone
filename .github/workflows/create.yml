                  r("(?:hesapla\\s+|kaç eder\\s+)?(.+?)(?:\\s+(?:kaç eder|kaçtır|kac eder|eşittir|eder))?") { m ->
                      val v = Calc.tryEval(m.g(1))
                      if (v == null) {
                          null
                      } else {
                          val s = if (v == Math.floor(v) && Math.abs(v) < 1e15) {
                              v.toLong().toString()
                          } else {
                              String.format(java.util.Locale.US, "%.4f", v).trimEnd('0').trimEnd('.').replace('.', ',')
                          }
                          "Sonuç $s."
