        run: |
          cat > app/src/main/java/com/novax/assistant/JarvisReactorView.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RadialGradient
          import android.graphics.RectF
          import android.graphics.Shader
          import android.view.View
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.min
          import kotlin.math.sin

          /** Arc-reaktör tarzı animasyonlu orb. Duruma göre renk, hız ve parlaklık değiştirir. */
          class JarvisReactorView(ctx: Context) : View(ctx) {
              var state: OrbState = OrbState.IDLE
                  set(v) {
                      field = v
                      postInvalidateOnAnimation()
                  }
              var level: Float = 0f

              private val dens = ctx.resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()
              private val path = Path()
              private var cx = 0f
              private var cy = 0f
              private var radius = 0f
              private var t = 0f
              private var phase = 0f
              private var smooth = 0.25f
              private var lvl = 0f
              private var lastNs = 0L

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  cx = w / 2f
                  cy = h / 2f
                  radius = min(w, h) / 2f * 0.95f
              }

              private fun orbColor(): Int = when (state) {
                  OrbState.IDLE -> 0xFF00B8D4.toInt()
                  OrbState.LISTENING -> 0xFF00F0FF.toInt()
                  OrbState.THINKING -> 0xFFFFB300.toInt()
                  OrbState.SPEAKING -> 0xFF69F0FF.toInt()
                  OrbState.ERROR -> 0xFFFF3D3D.toInt()
              }

              private fun withAlpha(c: Int, a: Float): Int = ((a.coerceIn(0f, 1f) * 255).toInt() shl 24) or (c and 0x00FFFFFF)

              override fun onDraw(c: Canvas) {
                  if (radius <= 0f) return
                  val now = System.nanoTime()
                  val dt = if (lastNs == 0L) 0.016f else ((now - lastNs) / 1e9f).coerceAtMost(0.05f)
                  lastNs = now
                  t += dt
                  val speed = when (state) {
                      OrbState.IDLE -> 0.5f
                      OrbState.LISTENING -> 1.3f
                      OrbState.THINKING -> 3.4f
                      OrbState.SPEAKING -> 1.9f
                      OrbState.ERROR -> 0.3f
                  }
                  phase += dt * speed
                  lvl += (level - lvl) * min(1f, dt * 10f)
                  val target = when (state) {
                      OrbState.IDLE -> 0.28f
                      OrbState.LISTENING -> 0.45f + lvl * 0.55f
                      OrbState.THINKING -> 0.65f + 0.2f * sin(t * 6f)
                      OrbState.SPEAKING -> 0.55f + 0.4f * abs(sin(t * 7.3f) * cos(t * 3.1f))
                      OrbState.ERROR -> 0.85f
                  }
                  smooth += (target - smooth) * min(1f, dt * 8f)
                  val col = orbColor()
                  val r = radius

                  // dış parıltı
                  p.reset()
                  p.isAntiAlias = true
                  p.shader = RadialGradient(cx, cy, r, intArrayOf(withAlpha(col, 0.55f * smooth), withAlpha(col, 0.12f * smooth), 0), floatArrayOf(0.15f, 0.65f, 1f), Shader.TileMode.CLAMP)
                  c.drawCircle(cx, cy, r, p)
                  p.shader = null

                  // 1) dış ince halka
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 1.4f * dens
                  p.color = withAlpha(col, 0.55f)
                  c.drawCircle(cx, cy, r * 0.97f, p)

                  // 2) tik halkası (yavaş döner)
                  c.save()
                  c.rotate(phase * 9f, cx, cy)
                  p.strokeWidth = 1.2f * dens
                  for (i in 0 until 72) {
                      val a = i * (2f * PI.toFloat() / 72f)
                      val isLong = i % 6 == 0
                      val r1 = r * (if (isLong) 0.86f else 0.9f)
                      val r2 = r * 0.94f
                      p.color = withAlpha(col, if (isLong) 0.9f else 0.4f)
                      c.drawLine(cx + cos(a) * r1, cy + sin(a) * r1, cx + cos(a) * r2, cy + sin(a) * r2, p)
                  }
                  c.restore()

                  // 3) kalın yay parçaları (ters döner)
                  rect.set(cx - r * 0.78f, cy - r * 0.78f, cx + r * 0.78f, cy + r * 0.78f)
                  p.strokeWidth = 5.5f * dens
                  p.strokeCap = Paint.Cap.ROUND
                  for (i in 0 until 3) {
                      p.color = withAlpha(col, 0.35f + 0.5f * smooth)
                      c.drawArc(rect, -phase * 38f + i * 120f, 72f, false, p)
                  }
                  p.strokeCap = Paint.Cap.BUTT

                  // 4) kesikli halka
                  p.strokeWidth = 2f * dens
                  p.pathEffect = DashPathEffect(floatArrayOf(9f * dens, 13f * dens), phase * 40f * dens)
                  p.color = withAlpha(col, 0.6f)
                  c.drawCircle(cx, cy, r * 0.66f, p)
                  p.pathEffect = null

                  // 5) tarama yayı (düşünürken belirgin)
                  rect.set(cx - r * 0.7f, cy - r * 0.7f, cx + r * 0.7f, cy + r * 0.7f)
                  p.strokeWidth = 2.2f * dens
                  p.color = withAlpha(col, if (state == OrbState.THINKING) 0.95f else 0.3f)
                  c.drawArc(rect, phase * 110f, if (state == OrbState.THINKING) 110f else 30f, false, p)

                  // 6) altıgen çekirdek çerçevesi
                  c.save()
                  c.rotate(-phase * 22f, cx, cy)
                  path.reset()
                  val hr = r * (0.5f + 0.03f * smooth)
                  for (i in 0 until 6) {
                      val a = i * (PI.toFloat() / 3f)
                      val x = cx + cos(a) * hr
                      val y = cy + sin(a) * hr
                      if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
                  }
                  path.close()
                  p.strokeWidth = 2.2f * dens
                  p.color = withAlpha(col, 0.85f)
                  c.drawPath(path, p)
                  p.strokeWidth = 1f * dens
                  p.color = withAlpha(col, 0.4f)
                  for (i in 0 until 6 step 2) {
                      val a = i * (PI.toFloat() / 3f)
                      c.drawLine(cx + cos(a) * hr, cy + sin(a) * hr, cx - cos(a) * hr, cy - sin(a) * hr, p)
                  }
                  c.restore()

                  // 7) ses seviyesi halkası
                  p.strokeWidth = 3f * dens
                  p.color = withAlpha(col, 0.35f + 0.5f * lvl)
                  c.drawCircle(cx, cy, r * (0.38f + 0.12f * (if (state == OrbState.LISTENING) lvl else smooth * 0.5f)), p)

                  // 8) yörünge noktaları
                  p.style = Paint.Style.FILL
                  for (i in 0 until 3) {
                      val a = phase * 1.6f + i * (2f * PI.toFloat() / 3f)
                      p.color = withAlpha(col, 0.95f)
                      c.drawCircle(cx + cos(a) * r * 0.58f, cy + sin(a) * r * 0.58f, 3f * dens, p)
                  }

                  // 9) çekirdek
                  val cr = r * (0.27f + 0.05f * smooth)
                  p.shader = RadialGradient(cx, cy, cr, intArrayOf(0xFFFFFFFF.toInt(), withAlpha(col, 0.95f), withAlpha(col, 0.15f)), floatArrayOf(0f, 0.55f, 1f), Shader.TileMode.CLAMP)
                  c.drawCircle(cx, cy, cr, p)
                  p.shader = null

                  postInvalidateOnAnimation()
              }
          }
          NOVAX_EOF

