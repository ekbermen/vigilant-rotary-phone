      - name: Yaz app/src/main/java/com/novax/assistant/NovaxService.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/NovaxService.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.app.Notification
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.drawable.Icon
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager

          /** Her zaman açık çalışan gerçek foreground service: mikrofon türünde, uyandırma kelimesini dinler. */
          class NovaxService : Service(), Bus.Listener {

              companion object {
                  const val ACTION_START = "com.novax.assistant.START"
                  const val ACTION_LISTEN = "com.novax.assistant.LISTEN"
                  const val ACTION_STOP = "com.novax.assistant.STOP"
                  const val NOTIF_ID = 1001
                  @Volatile var running = false

                  fun start(ctx: Context) {
                      ctx.startForegroundService(Intent(ctx, NovaxService::class.java).setAction(ACTION_START))
                  }

                  fun stop(ctx: Context) {
                      ctx.stopService(Intent(ctx, NovaxService::class.java))
                  }
              }

              private var wake: PowerManager.WakeLock? = null
              private var lastText = ""

              override fun onBind(intent: Intent?): IBinder? = null

              private fun wakeHint(): String = "\"" + Prefs.wakeWord.replaceFirstChar { it.uppercase() } + "\" de, dinliyorum"

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (!goForeground(wakeHint())) {
                      Bus.log("Foreground servis başlatılamadı (mikrofon izni?)")
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  running = true
                  Voice.init(this)
                  Bus.add(this)
                  if (wake == null) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      val wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "novax:service")
                      wl.acquire(12 * 60 * 60 * 1000L)
                      wake = wl
                  }
                  if (intent?.action == ACTION_LISTEN) {
                      Voice.listenOnce()
                  } else if (Prefs.wakeOn && Voice.mode == Voice.Mode.OFF) {
                      Voice.startWake()
                  }
                  if (Prefs.overlayOn) Overlay.show(this)
                  return START_STICKY
              }

              private fun goForeground(text: String): Boolean {
                  return try {
                      val n = buildNotification(text)
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                      } else {
                          startForeground(NOTIF_ID, n)
                      }
                      lastText = text
                      true
                  } catch (e: Exception) {
                      Bus.log("startForeground: " + e.message)
                      false
                  }
              }

              private fun buildNotification(text: String): Notification {
                  val open = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val listen = PendingIntent.getService(this, 1, Intent(this, NovaxService::class.java).setAction(ACTION_LISTEN), PendingIntent.FLAG_IMMUTABLE)
                  val stop = PendingIntent.getService(this, 2, Intent(this, NovaxService::class.java).setAction(ACTION_STOP), PendingIntent.FLAG_IMMUTABLE)
                  val ic = Icon.createWithResource(this, R.drawable.ic_notif)
                  return Notification.Builder(this, NovaxApp.CH_SERVICE)
                      .setSmallIcon(R.drawable.ic_notif)
                      .setContentTitle("NOVAX aktif")
                      .setContentText(text)
                      .setContentIntent(open)
                      .setOngoing(true)
                      .addAction(Notification.Action.Builder(ic, "Dinle", listen).build())
                      .addAction(Notification.Action.Builder(ic, "Kapat", stop).build())
                      .build()
              }

              private fun updateText(text: String) {
                  if (text == lastText) return
                  lastText = text
                  (getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).notify(NOTIF_ID, buildNotification(text))
              }

              override fun onState(s: OrbState) {
                  val t = when (s) {
                      OrbState.IDLE -> if (Prefs.wakeOn) wakeHint() else "Beklemede"
                      OrbState.LISTENING -> "Dinliyorum…"
                      OrbState.THINKING -> "Düşünüyorum…"
                      OrbState.SPEAKING -> "Konuşuyorum…"
                      OrbState.ERROR -> "Hata oluştu"
                  }
                  updateText(t)
              }

              override fun onDestroy() {
                  running = false
                  Bus.remove(this)
                  Voice.stopAll()
                  Overlay.hide()
                  try { wake?.release() } catch (_: Exception) {}
                  wake = null
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  super.onDestroy()
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Overlay.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/Overlay.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager

          /** Her uygulamanın üstünde duran yüzen Jarvis reaktörü. Dokun: dinle · Uzun bas: uygulamayı aç · Sürükle: taşı. */
          object Overlay : Bus.Listener {
              private val main = Handler(Looper.getMainLooper())
              private var view: JarvisReactorView? = null
              private var wm: WindowManager? = null

              fun show(ctx: Context) {
                  main.post {
                      val app = ctx.applicationContext
                      if (view == null && Settings.canDrawOverlays(app)) {
                          val size = (84 * app.resources.displayMetrics.density).toInt()
                          val v = JarvisReactorView(app)
                          val w = app.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                          val p = WindowManager.LayoutParams(
                              size, size, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.TRANSLUCENT
                          )
                          p.gravity = Gravity.TOP or Gravity.START
                          p.x = 16
                          p.y = 320
                          v.state = Bus.current
                          v.setOnTouchListener(DragListener(app, w, p))
                          try {
                              w.addView(v, p)
                              view = v
                              wm = w
                              Bus.add(this)
                          } catch (e: Exception) {
                              Bus.log("Overlay eklenemedi: " + e.message)
                          }
                      }
                  }
              }

              fun hide() {
                  main.post {
                      val v = view
                      if (v != null) {
                          try { wm?.removeView(v) } catch (_: Exception) {}
                          view = null
                          wm = null
                          Bus.remove(this)
                      }
                  }
              }

              private class DragListener(
                  val ctx: Context,
                  val w: WindowManager,
                  val p: WindowManager.LayoutParams
              ) : View.OnTouchListener {
                  var sx = 0f
                  var sy = 0f
                  var ox = 0
                  var oy = 0
                  var moved = false
                  var longFired = false
                  val longPress = Runnable {
                      longFired = true
                      ctx.startActivity(Intent(ctx, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  }

                  override fun onTouch(v: View, e: MotionEvent): Boolean {
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              sx = e.rawX; sy = e.rawY; ox = p.x; oy = p.y
                              moved = false; longFired = false
                              main.postDelayed(longPress, 650L)
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - sx
                              val dy = e.rawY - sy
                              if (Math.abs(dx) > 12f || Math.abs(dy) > 12f) {
                                  moved = true
                                  main.removeCallbacks(longPress)
                              }
                              if (moved) {
                                  p.x = ox + dx.toInt()
                                  p.y = oy + dy.toInt()
                                  try { w.updateViewLayout(v, p) } catch (_: Exception) {}
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              main.removeCallbacks(longPress)
                              if (!moved && !longFired && e.actionMasked == MotionEvent.ACTION_UP) {
                                  if (Voice.speaking) Voice.stopSpeaking() else Voice.listenOnce()
                              }
                          }
                      }
                      return true
                  }
              }

              override fun onState(s: OrbState) { view?.state = s }
              override fun onLevel(v: Float) { view?.level = v }
          }
          NOVAX_EOF

