                  r("(?:saat kaç|saat kac|saati söyle|saati soyle|şu an saat kaç|saat ne|what time is it|time)") { Act.clock() }
                  r("(?:bugün (?:günlerden ne|ayın kaçı|tarih ne|tarih)|tarih ne|bugünün tarihi|hangi gündeyiz|bugün ayın kaçı|what(?:s| is) the date)") { Act.dateToday() }
                  r("(?:pil|şarj|sarj|batarya)(?:\\s+(?:durumu|ne kadar|kaç|kac|yüzde kaç|yüzde kac|seviyesi))?") { Act.battery() }

                  // ============================================================ fener / ses / parlaklık / medya
                  r("(?:el\\s+)?fener\\w*\\s+(aç|ac|yak|kapat|söndür|sondur|çalıştır)") { m -> Act.flashlight(isOnWord.containsMatchIn(m.g(1))) }
                  r("(?:turn\\s+)?(on|off)\\s+(?:the\\s+)?flashlight") { m -> Act.flashlight(m.g(1).equals("on", true)) }
                  r("(?:sesi|ses seviyesini|ses düzeyini|müzik sesini|medya sesini)\\s+(?:yüzde\\s*)?%?(\\d{1,3})(?:\\s*yüzde)?(?:\\s+(?:yap|olsun|ayarla|yapar mısın))?") { m ->
                      Act.setVolume(m.g(1).toInt(), "music")
