                  r("(?:benim\\s+)?(?:adım|adim|ismim)\\s+(.+)|bana\\s+(.+?)\\s+(?:de|diye hitap et|diye seslen)") { m ->
                      val n = Text.cap((m.g(1).ifBlank { m.g(2) }).trim())
