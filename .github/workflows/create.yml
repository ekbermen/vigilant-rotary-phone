          package com.novax.assistant

          import android.app.Notification
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          /**
           * Android 14+, mikrofon türündeki foreground servisin açılışta arka plandan başlatılmasına izin vermez.
           * Bu yüzden açılışta tek dokunuşluk bir bildirim bırakırız.
           */
          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(ctx: Context, intent: Intent) {
                  Prefs.init(ctx)
                  if (!Prefs.wakeOn || !Prefs.bootHint) return
                  NovaxApp.createChannels(ctx)
                  val pi = PendingIntent.getActivity(ctx, 7, Intent(ctx, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK), PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(ctx, NovaxApp.CH_ALERT)
                      .setSmallIcon(R.drawable.ic_notif)
                      .setContentTitle("Novax hazır")
                      .setContentText("Dinlemeyi başlatmak için dokun")
                      .setContentIntent(pi).setAutoCancel(true).build()
                  (ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).notify(77, n)
              }
          }
