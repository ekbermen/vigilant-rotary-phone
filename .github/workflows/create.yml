                  r("(?:müziği|muzigi|şarkıyı|sarkiyi|medyayı|videoyu)\\s*(?:devam ettir|devam et|oynat|başlat|baslat|çal|cal)|devam et|resume|play music") { Act.media("play") }
                  r("(?:sonraki|sıradaki|siradaki|bir sonraki|sonrakine geç|sonrakine gec)(?:\\s+(?:şarkı|sarki|parça|parca))?|şarkıyı geç|sarkiyi gec|parçayı geç|next(?: song| track)?|skip") { Act.media("next") }
                  r("(?:önceki|onceki|bir önceki|geri al)\\s+(?:şarkı|sarki|parça|parca)|önceki şarkıya dön|previous(?: song| track)?") { Act.media("previous") }
                  r("(?:titre|titreş|titres|telefonu titret|titret)") { Act.vibrate() }

