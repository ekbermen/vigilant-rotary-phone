                  r("(?:sesi|sesi biraz)\\s+(?:artır|artir|yükselt|yukselt|aç|ac|çoğalt)") { Act.adjustVolume(true) }
                  r("(?:sesi|sesi biraz)\\s+(?:kıs|kis|azalt|düşür|dusur|alçalt)") { Act.adjustVolume(false) }
                  r("(?:sesi\\s+)?(?:sessize\\s+al|sesi\\s+kapat|sessiz\\s+mod|mute)") { Act.mute() }
                  r("sesi\\s+(?:son|full|maksimum|sonuna)(?:\\s+(?:aç|ac|yap|kadar aç))?") { Act.setVolume(100, "music") }
