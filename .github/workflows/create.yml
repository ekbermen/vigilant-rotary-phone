      - name: Yaz app/src/main/java/com/novax/assistant/Voice.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/Voice.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import java.util.Locale

          /**
           * Ses motoru: uyandırma kelimesi döngüsü, tek seferlik komut dinleme ve TTS.
           * Her şey ana thread'de çalışır (SpeechRecognizer zorunluluğu).
           */
          object Voice : RecognitionListener {
              enum class Mode { OFF, WAKE, COMMAND }

              private lateinit var app: Context
              private val main = Handler(Looper.getMainLooper())
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var rec: SpeechRecognizer? = null
              private var inited = false
              private var afterSpeech: (() -> Unit)? = null
              private var errorStreak = 0

              @Volatile
              var mode: Mode = Mode.OFF

              @Volatile
              var speaking: Boolean = false

              fun init(ctx: Context) {
                  if (inited) return
                  inited = true
                  app = ctx.applicationContext
                  tts = TextToSpeech(app) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          ttsReady = true
                          applyLanguage()
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) {}
                              override fun onDone(utteranceId: String?) {
                                  if (utteranceId != null && utteranceId.startsWith("last")) finishSpeech()
                              }
                              @Deprecated("Deprecated in Java")
                              override fun onError(utteranceId: String?) {
                                  finishSpeech()
                              }
                          })
                      } else {
                          Bus.log("TTS başlatılamadı")
                      }
                  }
              }

              fun applyLanguage() {
                  val loc = Locale.forLanguageTag(Prefs.lang)
                  val r = tts?.setLanguage(loc)
                  if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) Bus.log("TTS dili desteklenmiyor: " + Prefs.lang)
                  tts?.setSpeechRate(Prefs.rate)
              }

              // ------------------------------------------------------------------ konuşma
              fun speak(text: String, then: (() -> Unit)? = null) {
                  val clean = text.replace(Regex("[*_`#>]"), "").replace(Regex("https?://\\S+"), "bağlantı").trim()
                  if (clean.isEmpty()) {
                      then?.invoke()
                      return
                  }
                  if (!Prefs.ttsOn || !ttsReady) {
                      Bus.setState(OrbState.IDLE)
                      then?.invoke()
                      main.post { resume() }
                      return
                  }
                  main.post {
                      destroyRec()
                      speaking = true
                      afterSpeech = then
                      Bus.setState(OrbState.SPEAKING)
                      val parts = splitForTts(clean)
                      for (i in parts.indices) {
                          val id = if (i == parts.lastIndex) "last$i" else "part$i"
                          val queueMode = if (i == 0) TextToSpeech.QUEUE_FLUSH else TextToSpeech.QUEUE_ADD
                          tts?.speak(parts[i], queueMode, null, id)
                      }
                  }
              }

              private fun splitForTts(s: String): List<String> {
                  val out = ArrayList<String>()
                  val sb = StringBuilder()
                  for (sentence in s.split(Regex("(?<=[.!?\\n])\\s+"))) {
                      if (sb.length + sentence.length > 1200 && sb.isNotEmpty()) {
                          out.add(sb.toString())
                          sb.setLength(0)
                      }
                      sb.append(sentence).append(' ')
                  }
                  if (sb.isNotBlank()) out.add(sb.toString().trim())
                  return if (out.isEmpty()) listOf(s) else out
              }

              private fun finishSpeech() {
                  main.post {
                      speaking = false
                      Bus.setState(OrbState.IDLE)
                      val cb = afterSpeech
                      afterSpeech = null
                      cb?.invoke()
                      resume()
                  }
              }

              fun stopSpeaking() {
                  main.post {
                      tts?.stop()
                      if (speaking) finishSpeech()
                  }
              }

              // ------------------------------------------------------------------ dinleme
              fun startWake() {
                  main.post {
                      if (mode != Mode.COMMAND) {
                          mode = Mode.WAKE
                          errorStreak = 0
                          startRec()
                      }
                  }
              }

              fun listenOnce() {
                  main.post {
                      tts?.stop()
                      speaking = false
                      afterSpeech = null
                      mode = Mode.COMMAND
                      errorStreak = 0
                      startRec()
                  }
              }

              fun stopAll() {
                  main.post {
                      mode = Mode.OFF
                      destroyRec()
                      Bus.setState(OrbState.IDLE)
                  }
              }

              private fun resume() {
                  if (mode == Mode.WAKE) main.postDelayed({ startRec() }, 350L)
              }

              private fun backToIdleMode() {
                  mode = if (Prefs.wakeOn && NovaxService.running) Mode.WAKE else Mode.OFF
              }

              private fun startRec() {
                  main.post {
                      if (speaking || mode == Mode.OFF) return@post
                      if (app.checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          Bus.log("Mikrofon izni yok")
                          mode = Mode.OFF
                          return@post
                      }
                      if (!SpeechRecognizer.isRecognitionAvailable(app)) {
                          Bus.log("Cihazda konuşma tanıma servisi yok")
                          mode = Mode.OFF
                          return@post
                      }
                      destroyRec()
                      val r = SpeechRecognizer.createSpeechRecognizer(app)
                      r.setRecognitionListener(Voice)
                      rec = r
                      val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, Prefs.lang)
                      i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      i.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                      i.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, app.packageName)
                      try {
                          r.startListening(i)
                          Bus.setState(OrbState.LISTENING)
                      } catch (e: Exception) {
                          Bus.log("Dinleme başlatılamadı: " + e.message)
                          retry(1500L)
                      }
                  }
              }

              private fun destroyRec() {
                  try { rec?.cancel() } catch (_: Exception) {}
                  try { rec?.destroy() } catch (_: Exception) {}
                  rec = null
              }

              private fun retry(delay: Long) {
                  errorStreak++
                  val d = if (errorStreak > 5) 5000L else delay
                  main.postDelayed({
                      if (mode != Mode.OFF && !speaking) startRec()
                  }, d)
              }

              // ------------------------------------------------------------------ uyandırma kelimesi
              private fun wakeRegex(): Regex {
                  val w = Prefs.wakeWord.trim().lowercase()
                  val body = if (w == "novax" || w == "nova") "no+\\s?v[ae]+\\s?(?:x|ks|cks)?"
                  else Regex.escape(w).replace(" ", "\\s+")
                  return Regex("(?i)\\b" + body + "\\b")
              }

              private fun handleHeard(raw: String) {
                  val t = raw.trim()
                  if (t.isEmpty()) {
                      errorStreak = 0
                      if (mode == Mode.COMMAND) {
                          backToIdleMode()
                          Bus.setState(OrbState.IDLE)
                      }
                      resume()
                      return
                  }
                  errorStreak = 0
                  when (mode) {
                      Mode.COMMAND -> {
                          backToIdleMode()
                          Brain.handle(t)
                      }
                      Mode.WAKE -> {
                          val m = wakeRegex().find(t)
                          if (m == null) {
                              startRec()
                              return
                          }
                          val rest = t.substring(m.range.last + 1).trim().trimStart(',', '.', ':', ' ')
                          val before = t.substring(0, m.range.first).replace(Regex("(?i)\\b(hey|ey|tamam|merhaba|selam)\\b"), "").trim()
                          val cmd = if (rest.length >= 2) rest else before
                          if (cmd.length >= 2) {
                              Brain.handle(cmd)
                          } else {
                              mode = Mode.COMMAND
                              speak("Efendim?") { startRec() }
                          }
                      }
                      Mode.OFF -> {}
                  }
              }

              override fun onResults(results: Bundle?) {
                  val list = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                  handleHeard(list?.firstOrNull() ?: "")
              }

              override fun onPartialResults(partialResults: Bundle?) {
                  val p = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull() ?: return
                  if (mode == Mode.COMMAND) Bus.partial(p)
              }

              override fun onError(error: Int) {
                  when (error) {
                      SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS -> {
                          mode = Mode.OFF
                          Bus.log("Mikrofon izni verilmemiş")
                          Bus.setState(OrbState.ERROR)
                      }
                      SpeechRecognizer.ERROR_RECOGNIZER_BUSY -> retry(1200L)
                      SpeechRecognizer.ERROR_CLIENT -> retry(600L)
                      SpeechRecognizer.ERROR_NO_MATCH, SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> {
                          if (mode == Mode.COMMAND) {
                              backToIdleMode()
                              Bus.setState(OrbState.IDLE)
                              Bus.partial("")
                              resume()
                          } else {
                              errorStreak = 0
                              retry(150L)
                          }
                      }
                      else -> retry(1500L)
                  }
              }

              override fun onRmsChanged(rmsdB: Float) { Bus.level(((rmsdB + 2f) / 12f).coerceIn(0f, 1f)) }
              override fun onReadyForSpeech(params: Bundle?) {}
              override fun onBeginningOfSpeech() {}
              override fun onBufferReceived(buffer: ByteArray?) {}
              override fun onEndOfSpeech() { Bus.level(0f) }
              override fun onEvent(eventType: Int, params: Bundle?) {}
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/WaveView.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/WaveView.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.view.View
          import kotlin.math.abs
          import kotlin.math.sin

          /** Konuşma/dinleme sırasında hareket eden ses çubukları. */
          class WaveView(ctx: Context) : View(ctx) {
              var state: OrbState = OrbState.IDLE
              var level: Float = 0f
              private val dn = ctx.resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val bars = 36
              private val hs = FloatArray(bars)
              private var t = 0f
              private var last = 0L

              override fun onDraw(c: Canvas) {
                  val now = System.nanoTime()
                  val dt = if (last == 0L) 0.016f else ((now - last) / 1e9f).coerceAtMost(0.05f)
                  last = now
                  t += dt
                  val amp = when (state) {
                      OrbState.LISTENING -> 0.15f + level * 0.85f
                      OrbState.SPEAKING -> 0.55f
                      OrbState.THINKING -> 0.25f
                      OrbState.ERROR -> 0.1f
                      OrbState.IDLE -> 0.06f
                  }
                  val bw = width / bars.toFloat()
                  p.style = Paint.Style.FILL
                  p.color = when (state) {
                      OrbState.THINKING -> 0xFFFFB300.toInt()
                      OrbState.ERROR -> 0xFFFF3D3D.toInt()
                      else -> 0xFF00E5FF.toInt()
                  }
                  for (i in 0 until bars) {
                      val env = 0.35f + 0.65f * (1f - abs(i - bars / 2f) / (bars / 2f))
                      val v = abs(sin(t * 6f + i * 0.7f) * 0.6f + sin(t * 3.3f + i * 1.3f) * 0.4f)
                      hs[i] += (amp * env * v - hs[i]) * 0.3f
                      val bh = (height * (0.06f + hs[i] * 0.94f)).coerceAtLeast(2f * dn)
                      val x = i * bw + bw * 0.2f
                      c.drawRoundRect(x, (height - bh) / 2f, x + bw * 0.6f, (height + bh) / 2f, 2f * dn, 2f * dn, p)
                  }
                  postInvalidateOnAnimation()
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Web.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/Web.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import java.net.HttpURLConnection
          import java.net.URL

          object Web {
              fun fetchText(url: String, max: Int = 6000): String {
                  if (!url.startsWith("http")) return "HATA: geçersiz adres"
                  val c = URL(url).openConnection() as HttpURLConnection
                  try {
                      c.connectTimeout = 12000
                      c.readTimeout = 20000
                      c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 14) Novax/1.0")
                      c.instanceFollowRedirects = true
                      val code = c.responseCode
                      if (code !in 200..299) return "HATA: HTTP $code"
                      val raw = c.inputStream.bufferedReader().use { it.readText() }
                      val txt = raw.replace(Regex("(?is)<(script|style|noscript)[^>]*>.*?</\\1>"), " ")
                          .replace(Regex("(?s)<[^>]+>"), " ")
                          .replace("&nbsp;", " ").replace("&amp;", "&").replace("&quot;", "\"").replace("&#39;", "'")
                          .replace(Regex("\\s+"), " ").trim()
                      return Text.clip(txt, max)
                  } catch (e: Exception) {
                      return "HATA: " + e.message
                  } finally {
                      c.disconnect()
                  }
              }
          }
          NOVAX_EOF

      - name: Novax gelişmiş özellik paketi
        run: |
          cat > app/src/main/java/com/novax/assistant/NovaxFeaturePack.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import java.io.File
          import java.util.Locale
          import java.util.concurrent.Executors

          /** Novax gelişmiş özellikler: gerçek Android sonucu olmadan başarı iddiası üretmez. */
          object NovaxFeaturePack {
              private val pool = Executors.newCachedThreadPool()
              private const val BG = "@Arkaplan"
              private const val NEED_ACCESS = "Bunun için erişilebilirlik servisini açman gerekiyor."

              data class ApiProbe(val url: String, val http: Int, val latencyMs: Long, val ok: Boolean, val detail: String)
              data class FeatureState(val accessibility:Boolean,val microphone:Boolean,val camera:Boolean,val contacts:Boolean,val call:Boolean,val overlay:Boolean,val notifications:Boolean)

              fun state(ctx: Context = NovaxApp.instance) = FeatureState(
                  NovaxAccessibilityService.connected,
                  ctx.checkSelfPermission(Manifest.permission.RECORD_AUDIO)==PackageManager.PERMISSION_GRANTED,
                  Build.VERSION.SDK_INT < 23 || ctx.checkSelfPermission(Manifest.permission.CAMERA)==PackageManager.PERMISSION_GRANTED,
                  ctx.checkSelfPermission(Manifest.permission.READ_CONTACTS)==PackageManager.PERMISSION_GRANTED,
                  ctx.checkSelfPermission(Manifest.permission.CALL_PHONE)==PackageManager.PERMISSION_GRANTED,
                  Settings.canDrawOverlays(ctx),
                  Build.VERSION.SDK_INT < 33 || ctx.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)==PackageManager.PERMISSION_GRANTED
              )

              fun isBackgroundCommand(text:String)=text.trimStart().startsWith(BG, true)
              fun stripBackground(text:String)=text.trimStart().removePrefix(BG).trim()

              fun handle(text:String):String? {
                  val raw=text.trim(); if(raw.isBlank()) return null
                  val background=isBackgroundCommand(raw); val command=stripBackground(raw); val n=Text.norm(command)
                  if(n.matches(Regex("(?:yeni sohbet|new chat|yeni konuşma|yeni sohbet aç)"))) return "NEW_CHAT"
                  if(n.matches(Regex("(?:live kamera|canlı kamera|kamera modu|kameradan bana bak|kameradan bak)"))) return openLiveCamera(NovaxApp.instance)
                  if(n.contains("ekran görüntüsü")||n.contains("screenshot")||n=="ss al") return screenshot()
                  if(n.startsWith("api test")||n.startsWith("apiyi test")||n.contains("api kontrol et")) {
                      val target=Regex("https?://\\S+").find(command)?.value
                      return if(target==null) "API testi için URL belirt." else asyncLabel("API testi",background){probeApi(target)}
                  }
                  if(n.contains("model bul")||n.contains("ai modeli bul")||n.contains("hangi model")) return "Model sırası: API testi → şirket/sağlayıcı doğrulaması → model doğrulaması → gerçek istek testi. Sonuç yoksa model uydurulmaz."
                  if(n.contains("sesli mesaj")&&(n.contains("whatsapp")||n.contains("telegram")||n.contains("mesaj"))) {
                      val p=extractVoice(command)?:return "Sesli mesaj için kişi ve metni belirt."
                      return asyncLabel("Sesli mesaj",background){createAndShareSpeech(p.first,p.second)}
                  }
                  if(n.contains("klavye")&&(n.contains("kullan")||n.contains("kontrol"))) return if(NovaxAccessibilityService.connected) "Klavye kontrolü hazır." else NEED_ACCESS
                  if(background) return asyncLabel("Arka plan görevi",true){runBackground(command)}
                  if(n.contains("sahte")||n.contains("fake")) return "Sahte işlem ve sahte başarı bildirimi kapalı."
                  return null
              }

              private fun asyncLabel(label:String,background:Boolean,task:()->String):String {
                  if(!background)return task()
                  pool.execute{val r=try{task()}catch(e:Exception){"HATA: ${e.message}"};Bus.log("$label: $r");Voice.speak("$label tamamlandı. ${Text.clip(r,280)}")}
                  return "$label arka planda başlatıldı."
              }

              private fun runBackground(command:String):String {
                  val n=Text.norm(command)
                  if(n.contains("indir")){openPlayStoreSearch(command.replace(Regex("(?i).*?indir"),"").trim());return "Play Store açıldı; yükleme için kullanıcı onayı gerekir."}
                  return "Arka plan komutu alındı: ${Text.clip(command, 180)}. Gerçek işlem için ilgili Android uygulaması/izinleri gerekir."
              }

              private fun openPlayStoreSearch(q:String):Boolean=try{
                  NovaxApp.instance.startActivity(Intent(Intent.ACTION_VIEW,Uri.parse("market://search?q="+Uri.encode(q))).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));true
              }catch(_:Exception){try{NovaxApp.instance.startActivity(Intent(Intent.ACTION_VIEW,Uri.parse("https://play.google.com/store/search?q="+Uri.encode(q))).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));true}catch(_:Exception){false}}

              fun openLiveCamera(ctx:Context):String {
                  val ok=Build.VERSION.SDK_INT<23||ctx.checkSelfPermission(Manifest.permission.CAMERA)==PackageManager.PERMISSION_GRANTED
                  if(!ok){if(ctx is Activity)ctx.requestPermissions(arrayOf(Manifest.permission.CAMERA),4101);return "Live kamera için kamera izni gerekiyor."}
                  return try{ctx.startActivity(Intent(ctx,MainActivity::class.java).putExtra("NOVAX_LIVE_CAMERA",true).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));"Live kamera modu açılıyor."}catch(e:Exception){"HATA: ${e.message}"}
              }

              fun screenshot():String {
                  if(!NovaxAccessibilityService.connected)return "$NEED_ACCESS Ekran görüntüsü alınamadı."
                  val ok=NovaxAccessibilityService.instance?.global("screenshot")==true
                  return if(ok)"Ekran görüntüsü komutu Android'e iletildi." else "HATA: Android screenshot işlemini kabul etmedi; sahte görüntü oluşturulmadı."
              }

              fun probeApi(target:String):String {
                  val started=System.currentTimeMillis(); val result=try{
                      val c=java.net.URL(target).openConnection() as java.net.HttpURLConnection
                      c.connectTimeout=8000;c.readTimeout=10000;c.requestMethod="GET";val code=c.responseCode;c.disconnect()
                      ApiProbe(target,code,System.currentTimeMillis()-started,code in 200..499,"HTTP $code")
                  }catch(e:Exception){ApiProbe(target,-1,System.currentTimeMillis()-started,false,e.message?:"bağlantı hatası")}
                  val provider=provider(target)
                  return "API testi\nSağlayıcı: $provider\nHTTP: ${result.http}\nGecikme: ${result.latencyMs} ms\nDurum: ${if(result.ok)"erişilebilir" else "başarısız"}\nModel testi bundan sonra yapılır."
              }

              private fun provider(url:String):String=when{
                  url.contains("googleapis.com",true)->"Google"
                  url.contains("openai.com",true)->"OpenAI"
                  url.contains("anthropic.com",true)->"Anthropic"
                  url.contains("groq.com",true)->"Groq"
                  url.contains("mistral.ai",true)->"Mistral"
                  url.contains("openrouter.ai",true)->"OpenRouter"
                  url.contains("huggingface.co",true)->"Hugging Face"
                  else->"Bilinmeyen sağlayıcı"
              }

              private fun createAndShareSpeech(person:String,message:String):String {
                  val ctx=NovaxApp.instance;val dir=File(ctx.cacheDir,"novax_voice");dir.mkdirs();val out=File(dir,"novax_${System.currentTimeMillis()}.wav")
                  val tts=TextToSpeech(ctx){};tts.language=Locale("tr","TR")
                  val code=tts.synthesizeToFile(message,Bundle(),out,"novax_voice");tts.shutdown()
                  if(code!=TextToSpeech.SUCCESS)return "HATA: ses dosyası oluşturulamadı."
                  return try{
                      val uri=try{androidx.core.content.FileProvider.getUriForFile(ctx, ctx.packageName+".fileprovider", out)}catch(_:Exception){Uri.fromFile(out)}
                      val i=Intent(Intent.ACTION_SEND).apply{type="audio/wav";putExtra(Intent.EXTRA_STREAM,uri);addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_GRANT_READ_URI_PERMISSION)}
                      ctx.startActivity(Intent.createChooser(i,"$person için sesli mesaj").addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      "Ses dosyası hazırlandı; gönderme ekranı açıldı. Gerçek gönderim doğrulanmadan başarılı denmez."
                  }catch(e:Exception){"HATA: ${e.message}"}
              }

              private fun extractVoice(command:String):Pair<String,String>? {
                  Regex("(?i)(.+?)\\s*(?:kişisine|kisisine|kişiye|kisiye)\\s*(?:.*?diye)\\s+(.+)$").find(command)?.let{return it.groupValues[1].trim() to it.groupValues[2].trim()}
                  Regex("(?i)sesli mesaj\\s+(.+?)\\s*[:,-]\\s*(.+)$").find(command)?.let{return it.groupValues[1].trim() to it.groupValues[2].trim()}
                  return null
              }

              fun newChat(ctx:Context):String=try{ctx.startActivity(Intent(ctx,MainActivity::class.java).putExtra("NOVAX_NEW_CHAT",true).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));"Yeni sohbet açıldı."}catch(e:Exception){"HATA: ${e.message}"}
              fun type(text:String):String{if(!NovaxAccessibilityService.connected)return NEED_ACCESS;return if(NovaxAccessibilityService.instance?.typeText(text)==true)"Metin yazıldı." else "HATA: yazılabilir alan bulunamadı."}
              fun gesture(direction:String):String{if(!NovaxAccessibilityService.connected)return NEED_ACCESS;return if(NovaxAccessibilityService.instance?.scroll(direction)==true)"Ekran $direction kaydırıldı." else "HATA: ekran hareketi yapılamadı."}
              fun safePhone(number:String):String{val n=number.filter{it.isDigit()||it=='+'};if(n.length<7)return "HATA: numara geçersiz.";return try{NovaxApp.instance.startActivity(Intent(Intent.ACTION_DIAL,Uri.parse("tel:"+Uri.encode(n))).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));"Telefon uygulaması açıldı; PIN aktarılmadı."}catch(e:Exception){"HATA: ${e.message}"}}
          }
          NOVAX_EOF


