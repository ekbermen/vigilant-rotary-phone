                  r("(\\d+)\\s*(saniye|sn|dakika|dk|saat)(?:lik)?\\s+(?:için\\s+)?(?:bir\\s+)?(?:zamanlayıcı|zamanlayici|sayaç|sayac|timer|geri sayım|geri sayim)(?:\\s+(?:kur|başlat|baslat|ayarla|aç))?") { m ->
                      val n = m.g(1).toInt()
