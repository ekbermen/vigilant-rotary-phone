                  r("(?:.*?\\s)?(\\d{1,2})(?:[:.](\\d{2}))?\\s*(?:de|da|te|ta|e|a|ye|ya)?\\s+(?:için\\s+)?alarm\\w*\\s+(?:kur|ayarla|ekle|oluştur|olustur|koy)") { m ->
                      var h = m.g(1).toInt()
