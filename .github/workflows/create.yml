name: Build Novax APK

# Tek dosya: bütün Novax projesi (Kotlin, manifest, kaynaklar, Gradle) bu workflow içinde gömülü.
# Kullanım: bunu repoda .github/workflows/build.yml olarak kaydet, Actions > Run workflow.
# Opsiyonel secret: GEMINI_API_KEY (boşsa anahtarı uygulama içinden girersin).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: SDK paketleri (runner'daki hazır SDK)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "$ANDROID_HOME/platforms" || true

      - name: Klasörleri oluştur
        run: |
          mkdir -p app/src/main/java/com/novax/assistant app/src/main/res/values app/src/main/res/xml app/src/main/res/drawable

      - name: Yaz app/build.gradle
        run: |
          cat > app/build.gradle <<'NOVAX_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          def localProps = new Properties()
          def lp = rootProject.file("local.properties")
          if (lp.exists()) { lp.withInputStream { localProps.load(it) } }
          def geminiKey = (localProps.getProperty("GEMINI_API_KEY") ?: System.getenv("GEMINI_API_KEY") ?: "").trim()

          android {
              namespace 'com.novax.assistant'
              compileSdk 34

              defaultConfig {
                  applicationId "com.novax.assistant"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  buildConfigField "String", "GEMINI_API_KEY", "\"${geminiKey}\""
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildFeatures { buildConfig true }
              lint { abortOnError false }
          }

          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              // Bilerek bağımlılık yok: tüm arayüz programatik, ağ HttpURLConnection ile.
          }
          NOVAX_EOF

      - name: Yaz app/src/main/AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'NOVAX_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.SET_ALARM" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:name=".NovaxApp"
                  android:allowBackup="false"
                  android:icon="@drawable/ic_novax"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Novax"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".SetupActivity"
                      android:exported="false"
                      android:windowSoftInputMode="adjustResize" />

                  <service
                      android:name=".NovaxService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />

                  <service
                      android:name=".NovaxAccessibilityService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          NOVAX_EOF

      - name: Yaz app/src/main/res/drawable/ic_notif.xml
        run: |
          cat > app/src/main/res/drawable/ic_notif.xml <<'NOVAX_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="48" android:viewportHeight="48">
              <path android:strokeColor="#FFFFFF" android:strokeWidth="3" android:fillColor="#00000000"
                  android:pathData="M24,5 L40.5,14.5 L40.5,33.5 L24,43 L7.5,33.5 L7.5,14.5 Z" />
              <path android:strokeColor="#FFFFFF" android:strokeWidth="3.5" android:fillColor="#00000000"
                  android:pathData="M17,32 L17,16 L31,32 L31,16" />
          </vector>
          NOVAX_EOF

      - name: Yaz app/src/main/res/drawable/ic_novax.xml
        run: |
          cat > app/src/main/res/drawable/ic_novax.xml <<'NOVAX_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp"
              android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#02070D" android:pathData="M0,0h48v48h-48z" />
              <path android:strokeColor="#00E5FF" android:strokeWidth="2.5" android:fillColor="#00000000"
                  android:pathData="M24,5 L40.5,14.5 L40.5,33.5 L24,43 L7.5,33.5 L7.5,14.5 Z" />
              <path android:strokeColor="#00E5FF" android:strokeWidth="3" android:fillColor="#00000000"
                  android:pathData="M17,32 L17,16 L31,32 L31,16" />
          </vector>
          NOVAX_EOF

      - name: Yaz app/src/main/res/values/colors.xml
        run: |
          cat > app/src/main/res/values/colors.xml <<'NOVAX_EOF'
          <resources>
              <color name="bg">#02070D</color>
              <color name="cyan">#00E5FF</color>
              <color name="cyan_dim">#0097A7</color>
              <color name="amber">#FFB300</color>
              <color name="red">#FF3D3D</color>
          </resources>
          NOVAX_EOF

      - name: Yaz app/src/main/res/values/strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml <<'NOVAX_EOF'
          <resources>
              <string name="app_name">Novax</string>
              <string name="accessibility_desc">Novax, ekranı okumak, dokunmak, yazmak ve uygulamalar arası komutları çalıştırmak için erişilebilirlik hizmetini kullanır.</string>
          </resources>
          NOVAX_EOF

      - name: Yaz app/src/main/res/values/styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml <<'NOVAX_EOF'
          <resources>
              <style name="Theme.Novax" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
                  <item name="android:colorAccent">@color/cyan</item>
                  <item name="android:textColor">@color/cyan</item>
                  <item name="android:textColorHint">#5500E5FF</item>
              </style>
          </resources>
          NOVAX_EOF

      - name: Yaz app/src/main/res/xml/accessibility_config.xml
        run: |
          cat > app/src/main/res/xml/accessibility_config.xml <<'NOVAX_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagReportViewIds|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          NOVAX_EOF

      - name: FileProvider yolları
        run: |
          cat > app/src/main/res/xml/file_paths.xml <<'NOVAX_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
          </paths>
          NOVAX_EOF

      - name: Yaz build.gradle
        run: |
          cat > build.gradle <<'NOVAX_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          NOVAX_EOF

      - name: Yaz gradle.properties
        run: |
          cat > gradle.properties <<'NOVAX_EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          NOVAX_EOF

      - name: Yaz settings.gradle
        run: |
          cat > settings.gradle <<'NOVAX_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Novax"
          include(":app")
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Act.kt
        run: |
          cat > app/src/main/java/com/novax/assistant/Act.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.app.Notification
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.BatteryManager
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.AlarmClock
          import android.provider.MediaStore
          import android.provider.Settings
          import android.view.KeyEvent
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /** Telefon seviyesindeki tüm hazır eylemler. Her fonksiyon kullanıcıya/modele okunabilir bir sonuç metni döndürür. */
          object Act {
              private val ctx: Context get() = NovaxApp.instance

              // ------------------------------------------------------------------ başlatıcı
              fun start(i: Intent): Boolean {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  val direct = NovaxApp.visible > 0 || Settings.canDrawOverlays(ctx)
                  return try {
                      ctx.startActivity(i)
                      if (!direct) fullScreenFallback(i)
                      true
                  } catch (e: Exception) {
                      Bus.log("Başlatılamadı: ${e.message}")
                      false
                  }
              }

              private fun fullScreenFallback(i: Intent) {
                  val pi = PendingIntent.getActivity(ctx, (System.nanoTime() % 100000).toInt(), i, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  val n = Notification.Builder(ctx, NovaxApp.CH_ALERT)
                      .setSmallIcon(R.drawable.ic_notif).setContentTitle("Novax").setContentText("Açmak için dokun")
                      .setContentIntent(pi).setFullScreenIntent(pi, true).setAutoCancel(true).build()
                  (ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).notify((System.nanoTime() % 100000).toInt(), n)
              }

              // ------------------------------------------------------------------ uygulama / web
              fun openApp(name: String): String {
                  if (name.isBlank()) return "HATA: uygulama adı boş"
                  val app = Apps.find(name) ?: return "HATA: '$name' adında uygulama bulunamadı."
                  val i = ctx.packageManager.getLaunchIntentForPackage(app.pkg) ?: return "HATA: ${app.label} açılamıyor."
                  if (!start(i)) return "HATA: ${app.label} başlatılamadı."
                  NovaxAccessibilityService.instance?.waitForPackage(app.pkg, 4000L)
                  return "${app.label} açıldı."
              }

              fun openUrl(url: String): String {
                  val u = if (url.startsWith("http")) url else "https://$url"
                  return if (start(Intent(Intent.ACTION_VIEW, Uri.parse(u)))) "Açıldı: $u" else "HATA: açılamadı"
              }

              fun playYoutube(q: String): String {
                  val yt = "com.google.android.youtube"
                  val i = Intent(Intent.ACTION_SEARCH).setPackage(yt).putExtra("query", q)
                  val ok = try { start(i) } catch (_: Exception) { false }
                  val acc = NovaxAccessibilityService.instance
                  if (ok && acc != null) {
                      Thread.sleep(2500)
                      val dm = ctx.resources.displayMetrics
                      acc.tap(dm.widthPixels / 2f, dm.heightPixels * 0.34f)
                      return "YouTube'da '$q' açıldı."
                  }
                  return openUrl("https://www.youtube.com/results?search_query=" + Uri.encode(q))
              }

              fun navigate(dest: String): String {
                  val i = Intent(Intent.ACTION_VIEW, Uri.parse("google.navigation:q=" + Uri.encode(dest)))
                  return if (start(i)) "$dest için yol tarifi başladı." else openUrl("https://maps.google.com/?q=" + Uri.encode(dest))
              }

              // ------------------------------------------------------------------ alarm & zamanlayıcı
              fun setAlarm(h: Int, m: Int, label: String): String {
                  val i = Intent(AlarmClock.ACTION_SET_ALARM)
                      .putExtra(AlarmClock.EXTRA_HOUR, h.coerceIn(0, 23)).putExtra(AlarmClock.EXTRA_MINUTES, m.coerceIn(0, 59))
                      .putExtra(AlarmClock.EXTRA_MESSAGE, label.ifBlank { "Novax" }).putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                  return if (start(i)) "Alarm kuruldu: %02d:%02d".format(h, m) else "HATA: alarm kurulamadı"
              }

              fun setTimer(sec: Int, label: String): String {
                  if (sec <= 0) return "HATA: süre geçersiz"
                  val i = Intent(AlarmClock.ACTION_SET_TIMER)
                      .putExtra(AlarmClock.EXTRA_LENGTH, sec).putExtra(AlarmClock.EXTRA_MESSAGE, label.ifBlank { "Novax" })
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                  val mm = sec / 60
                  val ss = sec % 60
                  val txt = (if (mm > 0) "$mm dakika " else "") + (if (ss > 0) "$ss saniye" else "")
                  return if (start(i)) "Zamanlayıcı başladı: $txt" else "HATA: zamanlayıcı kurulamadı"
              }

              // ------------------------------------------------------------------ donanım
              fun flashlight(on: Boolean): String {
                  return try {
                      val cm = ctx.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      var id: String? = null
                      for (cid in cm.cameraIdList) {
                          if (cm.getCameraCharacteristics(cid).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true) { id = cid; break }
                      }
                      if (id == null) {
                          "HATA: cihazda flaş yok"
                      } else {
                          cm.setTorchMode(id, on)
                          if (on) "Fener açıldı." else "Fener kapandı."
                      }
                  } catch (e: Exception) {
                      "HATA: fener: ${e.message}"
                  }
              }

              fun setVolume(level: Int, stream: String): String {
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val st = when (stream.lowercase()) {
                      "ring" -> AudioManager.STREAM_RING
                      "alarm" -> AudioManager.STREAM_ALARM
                      "notification" -> AudioManager.STREAM_NOTIFICATION
                      else -> AudioManager.STREAM_MUSIC
                  }
                  val mx = am.getStreamMaxVolume(st)
                  val pct = level.coerceIn(0, 100)
                  val v = (mx * pct / 100f).toInt()
                  return try {
                      am.setStreamVolume(st, v, AudioManager.FLAG_SHOW_UI)
                      "Ses yüzde $pct yapıldı."
                  } catch (e: Exception) {
                      "HATA: ses ayarlanamadı: ${e.message}"
                  }
              }

              fun adjustVolume(up: Boolean): String {
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  am.adjustStreamVolume(AudioManager.STREAM_MUSIC, if (up) AudioManager.ADJUST_RAISE else AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI)
                  return if (up) "Sesi artırdım." else "Sesi kıstım."
              }

              fun mute(): String {
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  am.setStreamVolume(AudioManager.STREAM_MUSIC, 0, AudioManager.FLAG_SHOW_UI)
                  return "Ses kapatıldı."
              }

              fun setBrightness(level: Int): String {
                  if (!Settings.System.canWrite(ctx)) {
                      start(Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:" + ctx.packageName)))
                      return "HATA: 'Sistem ayarlarını değiştir' izni gerekli; ayar sayfasını açtım."
                  }
                  val pct = level.coerceIn(1, 100)
                  val v = (255 * pct / 100f).toInt()
                  Settings.System.putInt(ctx.contentResolver, Settings.System.SCREEN_BRIGHTNESS_MODE, Settings.System.SCREEN_BRIGHTNESS_MODE_MANUAL)
                  Settings.System.putInt(ctx.contentResolver, Settings.System.SCREEN_BRIGHTNESS, v)
                  return "Parlaklık yüzde $pct yapıldı."
              }

              fun adjustBrightness(up: Boolean): String {
                  val cur = try { Settings.System.getInt(ctx.contentResolver, Settings.System.SCREEN_BRIGHTNESS) } catch (_: Exception) { 128 }
                  val pct = (cur * 100 / 255 + (if (up) 20 else -20)).coerceIn(1, 100)
                  return setBrightness(pct)
              }

              fun media(action: String): String {
                  val code: Int = when (action.lowercase()) {
                      "play", "resume" -> KeyEvent.KEYCODE_MEDIA_PLAY
                      "pause" -> KeyEvent.KEYCODE_MEDIA_PAUSE
                      "next" -> KeyEvent.KEYCODE_MEDIA_NEXT
                      "previous", "prev" -> KeyEvent.KEYCODE_MEDIA_PREVIOUS
                      "stop" -> KeyEvent.KEYCODE_MEDIA_STOP
                      "toggle" -> KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE
                      else -> -1
                  }
                  if (code == -1) return "HATA: bilinmeyen medya komutu $action"
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, code))
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, code))
                  return "Medya: $action"
              }

              fun vibrate(ms: Long = 400L): String {
                  val v = ctx.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE))
                  return "Titreştim."
              }

              // ------------------------------------------------------------------ hızlı ayarlar & ayar sayfaları
              private val tileNames: Map<String, List<String>> = mapOf(
                  "wifi" to listOf("wi-fi", "wifi", "internet"), "wi-fi" to listOf("wi-fi", "wifi", "internet"),
                  "bluetooth" to listOf("bluetooth"), "ucak modu" to listOf("uçak modu", "ucak modu", "airplane", "flight mode"),
                  "uçak modu" to listOf("uçak modu", "ucak modu", "airplane", "flight mode"),
                  "fener" to listOf("fener", "flashlight", "torch"), "mobil veri" to listOf("mobil veri", "mobile data"),
                  "konum" to listOf("konum", "location"), "otomatik dondurme" to listOf("otomatik döndür", "auto-rotate", "auto rotate"),
                  "rahatsiz etme" to listOf("rahatsız etme", "do not disturb", "dnd"), "hotspot" to listOf("hotspot", "mobil hotspot", "internet paylaşımı"),
                  "pil tasarrufu" to listOf("pil tasarrufu", "battery saver"), "nfc" to listOf("nfc")
              )

              private fun findTile(acc: NovaxAccessibilityService, labels: List<String>): android.view.accessibility.AccessibilityNodeInfo? {
                  for (l in labels) {
                      val f = acc.findAll(l).firstOrNull()
                      if (f != null) return f
                  }
                  return null
              }

              fun quickToggle(name: String, want: Boolean?): String {
                  val acc = NovaxAccessibilityService.instance ?: return "HATA: Erişilebilirlik kapalı; kutucuğa dokunamam."
                  val key = Text.norm(name)
                  var labels: List<String>? = tileNames[key]
                  if (labels == null) {
                      for (e in tileNames.entries) {
                          if (key.contains(Text.norm(e.key))) { labels = e.value; break }
                      }
                  }
                  val useLabels: List<String> = labels ?: listOf(name)
                  acc.global("quick_settings")
                  Thread.sleep(900)
                  var node = findTile(acc, useLabels)
                  if (node == null) {
                      acc.scroll("left")
                      Thread.sleep(500)
                      node = findTile(acc, useLabels)
                  }
                  if (node == null) {
                      acc.global("back")
                      return "HATA: '$name' kutucuğu hızlı ayarlarda yok."
                  }
                  val target: android.view.accessibility.AccessibilityNodeInfo = node
                  if (want != null && Build.VERSION.SDK_INT >= 30) {
                      var cur: android.view.accessibility.AccessibilityNodeInfo? = target
                      var state = ""
                      var hops = 0
                      while (cur != null && hops < 4 && state.isEmpty()) {
                          state = Text.norm(cur.stateDescription?.toString() ?: "")
                          cur = cur.parent
                          hops++
                      }
                      val isOn = state.contains("acik") || state == "on"
                      val isOff = state.contains("kapali") || state.contains("off")
                      if ((want && isOn && !isOff) || (!want && isOff)) {
                          acc.global("back")
                          return name + " zaten " + (if (want) "açık" else "kapalı") + "."
                      }
                  }
                  val ok = acc.clickNode(target)
                  Thread.sleep(500)
                  acc.global("back")
                  return if (ok) "$name kutucuğuna dokundum." else "HATA: '$name' kutucuğuna dokunulamadı."
              }

              fun openSettings(page: String): String {
                  val a: String = when (Text.norm(page)) {
                      "wifi", "wi fi", "internet" -> if (Build.VERSION.SDK_INT >= 29) Settings.Panel.ACTION_INTERNET_CONNECTIVITY else Settings.ACTION_WIFI_SETTINGS
                      "bluetooth" -> Settings.ACTION_BLUETOOTH_SETTINGS
                      "display", "ekran", "parlaklik" -> Settings.ACTION_DISPLAY_SETTINGS
                      "sound", "ses" -> Settings.ACTION_SOUND_SETTINGS
                      "battery", "pil" -> Intent.ACTION_POWER_USAGE_SUMMARY
                      "apps", "uygulamalar" -> Settings.ACTION_APPLICATION_SETTINGS
                      "location", "konum" -> Settings.ACTION_LOCATION_SOURCE_SETTINGS
                      "accessibility", "erisilebilirlik" -> Settings.ACTION_ACCESSIBILITY_SETTINGS
                      "notifications", "bildirimler" -> Settings.ACTION_APP_NOTIFICATION_SETTINGS
                      "storage", "depolama" -> Settings.ACTION_INTERNAL_STORAGE_SETTINGS
                      "date", "tarih", "saat" -> Settings.ACTION_DATE_SETTINGS
                      "language", "dil" -> Settings.ACTION_LOCALE_SETTINGS
                      "airplane", "ucak modu" -> Settings.ACTION_AIRPLANE_MODE_SETTINGS
                      "nfc" -> Settings.ACTION_NFC_SETTINGS
                      "vpn" -> Settings.ACTION_VPN_SETTINGS
                      else -> Settings.ACTION_SETTINGS
                  }
                  val i = Intent(a)
                  if (a == Settings.ACTION_APP_NOTIFICATION_SETTINGS) i.putExtra(Settings.EXTRA_APP_PACKAGE, ctx.packageName)
                  return if (start(i)) "Ayar sayfası açıldı: $page" else "HATA: ayar sayfası açılamadı"
              }

              // ------------------------------------------------------------------ bilgi
              fun battery(): String {
                  val i = ctx.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val lvl = i?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = i?.getIntExtra(BatteryManager.EXTRA_SCALE, 100) ?: 100
                  val st = i?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
                  val charging = st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL
                  val temp = (i?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0) / 10f
                  val pct = if (scale > 0) lvl * 100 / scale else lvl
                  val chargeTxt = if (charging) "şarj oluyor" else "şarjda değil"
                  val tempTxt = String.format(Locale.US, "%.1f", temp)
                  return "Pil yüzde $pct, $chargeTxt, sıcaklık $tempTxt derece."
              }

              fun timeNow(): String = SimpleDateFormat("d MMMM yyyy EEEE, HH:mm", Locale("tr")).format(Date())
              fun clock(): String = "Saat " + SimpleDateFormat("HH:mm", Locale("tr")).format(Date())
              fun dateToday(): String = "Bugün " + SimpleDateFormat("d MMMM yyyy EEEE", Locale("tr")).format(Date())

              // ------------------------------------------------------------------ pano, paylaşım, kamera, not
              fun copy(text: String): String {
                  val cm = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText("novax", text))
                  return "Panoya kopyalandı."
              }

              fun share(text: String): String {
                  val i = Intent.createChooser(Intent(Intent.ACTION_SEND).setType("text/plain").putExtra(Intent.EXTRA_TEXT, text), "Paylaş")
                  return if (start(i)) "Paylaşım menüsü açıldı." else "HATA: paylaşılamadı"
              }

              fun takePhoto(front: Boolean): String {
                  val i = Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA)
                  if (front) {
                      i.putExtra("android.intent.extras.CAMERA_FACING", 1)
                      i.putExtra("android.intent.extra.USE_FRONT_CAMERA", true)
                  }
                  if (!start(i)) return "HATA: kamera açılamadı"
                  val acc = NovaxAccessibilityService.instance ?: return "Kamerayı açtım; erişilebilirlik kapalı, deklanşöre elle bas."
                  Thread.sleep(2200)
                  if (front) {
                      val sw = acc.clickText("ön kamera") || acc.clickText("selfie") || acc.clickText("switch camera")
                      if (!sw) Bus.log("Ön kamera düğmesi bulunamadı")
                  }
                  val shutter = listOf("deklanşör", "shutter", "fotoğraf çek", "take photo", "capture")
                  for (s in shutter) {
                      if (acc.clickText(s)) return "Fotoğraf çekildi."
                  }
                  val dm = ctx.resources.displayMetrics
                  return if (acc.tap(dm.widthPixels / 2f, dm.heightPixels * 0.9f)) "Deklanşöre dokundum." else "HATA: deklanşör bulunamadı"
              }

              fun createNote(title: String, content: String): String {
                  val id = MemoryStore.addNote(title, content)
                  val dir = ctx.getExternalFilesDir("notes") ?: ctx.filesDir
                  dir.mkdirs()
                  val safe = title.ifBlank { "not" }.replace(Regex("[^A-Za-z0-9ğüşöçıİĞÜŞÖÇ _-]"), "").trim().replace(' ', '_').take(40)
                  val f = File(dir, "${safe}_$id.txt")
                  f.writeText("$title\n\n$content")
                  return "Not kaydedildi: ${f.name}"
              }
          }
          NOVAX_EOF

