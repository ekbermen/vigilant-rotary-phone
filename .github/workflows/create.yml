                  }
                  r("(.+?)\\s+neydi") { m ->
                      val f = MemoryStore.recall(m.g(1).split(" ").first())
                      if (f.isEmpty()) null else f.take(3).joinToString(". ") { it.first + ": " + it.second }
                  }
                  r("(.+?)\\s+(?:unut|sil|hafızadan sil|hafizadan sil)") { m ->
                      if (MemoryStore.recall(m.g(1)).isEmpty()) {
                          null
                      } else {
