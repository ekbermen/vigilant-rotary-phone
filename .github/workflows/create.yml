                      val low = m.value.lowercase()
                      if ((low.contains("akşam") || low.contains("aksam") || low.contains("öğleden sonra") || low.contains("pm") || low.contains("gece")) && h in 1..11) h += 12
                      if (h > 23 || min > 59) null else Act.setAlarm(h, min, "Novax alarmı")
                  }
                  r("alarm\\w*\\s+(?:kur|ayarla)\\s+(\\d{1,2})(?:[:.](\\d{2}))?") { m ->
