                          "Pil neden üzgün? Çünkü hep yüzde bir kala hatırlanıyor.")
                  }
                  r("(?:yazı tura(?: at)?|yazi tura(?: at)?|yazı mı tura mı)") { if (rnd.nextBoolean()) "Yazı geldi." else "Tura geldi." }
                  r("(?:zar at|zar salla|bir zar at)") { "Zar ${rnd.nextInt(6) + 1} geldi." }
                  r("(\\d+)\\s*(?:ile|-)\\s*(\\d+)\\s*arasında\\s*(?:bir\\s*)?(?:rastgele\\s*)?(?:sayı|sayi)(?:\\s+söyle|\\s+seç|\\s+tut)?") { m ->
                      val a = m.g(1).toIntOrNull() ?: 1
                      val b = m.g(2).toIntOrNull() ?: 10
